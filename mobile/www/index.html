<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LIFEOS</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #0a0b0f;
        color: #f7f7f4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 32px;
      }
      .dot {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #c8f751, #7c6bff);
        margin: 0 auto 16px;
      }
      p { color: #8a929f; font-size: 14px; line-height: 1.6; max-width: 280px; }
      code { color: #c8f751; }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1 style="font-size:18px;letter-spacing:-0.02em;margin:0 0 8px">LIFEOS</h1>
      <p>
        Can't reach the LIFEOS server. Make sure your PC is running the app and
        is on the same Wi-Fi network as this phone
        (<code>http://192.168.1.5:3000</code>), then reopen the app.
      </p>
    </main>
  </body>
</html>
